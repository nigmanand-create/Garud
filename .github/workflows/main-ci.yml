# Continuous integration for the main (production) branch.
# Production URL https://garudhub.me — deploy from main after staging sign-off; see docs/PRODUCTION_READINESS.md
name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garud
          POSTGRES_PASSWORD: garud
          POSTGRES_DB: garudhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garud -d garudhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      DATABASE_URL: postgresql://garud:garud@localhost:5432/garudhub?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: /platform-api/v1
      BACKEND_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install, migrate, test
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npx prisma migrate deploy
          npm run prisma:seed
          npm test

      - name: Frontend — install, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
