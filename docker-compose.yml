# Local dev: Postgres only. Run the NestJS API on the host — see backend/LOCAL_DEVELOPMENT.md
services:
  postgres:
    image: postgres:16-alpine
    container_name: garudhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garud
      POSTGRES_PASSWORD: garud
      POSTGRES_DB: garudhub
    ports:
      - "5434:5432"
    volumes:
      - garudhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garud -d garudhub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  garudhub_pg_data:
